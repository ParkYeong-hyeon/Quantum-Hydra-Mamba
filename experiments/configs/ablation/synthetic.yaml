# Synthetic Benchmark Experiments Configuration
# Based on scripts/job_generation/generate_synthetic_jobs.py

# Extends base configuration
_extends: ../base.yaml

# SLURM Configuration (overrides base)
slurm:
  account: "m4807_g"
  constraint: "gpu&hbm80g"
  qos: "shared"
  nodes: 1
  gpus: 1
  cpus_per_task: 32
  time: "24:00:00"  # All models use 24 hours

# Model Configurations
models:
  # Group 1: Quantum Features → Classical Mixing
  "1a":
    name: "QuantumTransformer"
    group: 1
    description: "Quantum Features → Classical Attention"
  "1b":
    name: "QuantumMambaSSM"
    group: 1
    description: "Quantum Features → Classical Mamba SSM"
  "1c":
    name: "QuantumHydraSSM"
    group: 1
    description: "Quantum Features → Classical Hydra SSM"
  
  # Group 2: Classical Features → Quantum Mixing
  "2a":
    name: "ClassicalQuantumAttention"
    group: 2
    description: "Classical Features → Quantum Attention"
  "2d":
    name: "QuantumMambaHydraSSM"
    group: 2
    description: "Classical Features → Quantum Mamba-Hydra SSM"
  "2e":
    name: "QuantumHydraHydraSSM"
    group: 2
    description: "Classical Features → Quantum Hydra-Hydra SSM"
  
  # Group 3: Classical Baselines
  "3a":
    name: "ClassicalTransformer"
    group: 3
    description: "Classical Transformer Baseline"
  "3b":
    name: "TrueClassicalMamba"
    group: 3
    description: "True Classical Mamba Baseline"
  "3c":
    name: "TrueClassicalHydra"
    group: 3
    description: "True Classical Hydra Baseline"
  
  # Group 4: E2E Quantum
  "4a":
    name: "QuantumTransformerE2E"
    group: 4
    description: "End-to-End Quantum Transformer"
  "4d":
    name: "QuantumMambaE2E_Super"
    group: 4
    description: "End-to-End Quantum Mamba with Superposition"
  "4e":
    name: "QuantumHydraE2E_Super"
    group: 4
    description: "End-to-End Quantum Hydra with Superposition"

# Task Configurations
tasks:
  forrelation:
    name: "Forrelation"
    seq_lens: [50, 100, 200]
    description: "Quantum advantage benchmark"
  
  adding_problem:
    name: "Adding Problem"
    seq_lens: [100, 200, 500, 1000]
    description: "Long-range dependency task"
  
  selective_copy:
    name: "Selective Copy"
    seq_lens: [100, 200, 500, 1000]
    description: "Memory and retrieval task"

# Training Hyperparameters (overrides base)
training:
  n_qubits: 6
  n_layers: 2
  d_model: 128
  d_state: 16
  n_epochs: 100
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping: 20
  num_markers: 8  # For selective_copy task

# Seeds
seeds: [2024, 2025, 2026]

# Experiment Combinations
experiments:
  # All combinations will be generated from:
  # - models: all model IDs
  # - tasks: all tasks
  # - seq_lens: task-specific sequence lengths
  # - seeds: all seeds
  
  # Example: specific experiment
  # - model_id: "4e"
  #   task: "forrelation"
  #   seq_len: 200
  #   seed: 2024

# Output Configuration
output:
  base_dir: "./results/synthetic_benchmarks"
  logs_dir: "./results/synthetic_benchmarks/logs"
  job_dir: "./jobs/synthetic"

# Script Configuration
script:
  path: "scripts/training/run_synthetic_benchmark.py"
  args:
    data_dir: "./data/synthetic_benchmarks"
