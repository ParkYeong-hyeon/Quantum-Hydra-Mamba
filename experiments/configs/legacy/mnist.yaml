# Legacy MNIST Experiments Configuration
# Initial experiments with legacy models on MNIST
# Based on job_scripts/image/ and job_scripts/submit_mnist_dna_then_eeg.sh

# Extends base configuration
_extends: ../base.yaml

# SLURM Configuration (overrides base)
slurm:
  account: "m4727_g"
  constraint: "gpu&hbm80g"
  qos: "shared"
  nodes: 1
  gpus: 1
  cpus_per_task: 32
  time: "24:00:00"

# Model Configurations (Same as other legacy configs)
models:
  quantum_hydra:
    name: "QuantumHydra"
    description: "Original Quantum Hydra model"
    type: "legacy"
  
  quantum_mamba:
    name: "QuantumMamba"
    description: "Original Quantum Mamba model"
    type: "legacy"
  
  quantum_hydra_hybrid:
    name: "QuantumHydraHybrid"
    description: "Hybrid Quantum Hydra variant"
    type: "legacy"
  
  quantum_mamba_hybrid:
    name: "QuantumMambaHybrid"
    description: "Hybrid Quantum Mamba variant"
    type: "legacy"
  
  classical_hydra:
    name: "ClassicalHydra"
    description: "Classical Hydra baseline"
    type: "baseline"
  
  classical_mamba:
    name: "ClassicalMamba"
    description: "Classical Mamba baseline"
    type: "baseline"

# Dataset Configuration
datasets:
  mnist:
    name: "MNIST"
    description: "MNIST Digit Classification"
    n_train: 500
    n_valtest: 250

# Training Hyperparameters (overrides base)
training:
  n_qubits: 6
  qlcu_layers: 2
  d_model: 128
  d_state: 16
  n_epochs: 50
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 10

# Seeds
seeds: [2024, 2025, 2026, 2027, 2028]

# Experiment Configuration
experiments:
  # All legacy models on MNIST
  all_models:
    models: [quantum_hydra, quantum_mamba, quantum_hydra_hybrid, 
             quantum_mamba_hybrid, classical_hydra, classical_mamba]
    dataset: mnist
    seeds: [2024, 2025, 2026, 2027, 2028]
    script: "scripts/training/run_mnist_experiment.py"
    # Total: 6 models × 5 seeds = 30 experiments

# Output Configuration
output:
  base_dir: "./results/mnist_results"
  logs_dir: "./results/mnist_results/logs"
  job_dir: "./job_scripts/image"

# Script Configuration
script:
  path: "scripts/training/run_mnist_experiment.py"
  args:
    output_dir: "./results/mnist_results"
